 categories:()=>`<div class="wrap pg"><h1>أصناف المشتركين</h1><p class="sub"></p><div class="grid">${D.cats.map(c=>`<div class="card"><div class="ico">${ic(c.i)}</div><h3>${c.t}</h3><p>${c.d}</p></div>`).join('')}</div></div>`,
 digital:()=>`<div class="wrap pg"><h1>مؤشرات التحول الإلكتروني</h1><p class="sub"></p>${rings()}</div>`,
 news:()=>`<div class="wrap pg"><h1>أخبار ونشاطات الفرع</h1><p class="sub">بقية الأخبار محتوى تجريبي إلى حين تزويدنا بالأخبار الرسمية.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${NW().map(n=>newsCard(n)).map(h=>h.replace('class="card news ','class="card news " style="flex:none" data-x="')).join('')}</div></div>`,
 projects:()=>`<div class="wrap pg"><h1>مشاريع الفرع</h1><p class="sub">نماذج تجريبية تُستبدل ببيانات المشاريع الفعلية.</p><div class="grid">${PJ().map(p=>`<article class="card" style="padding:0;overflow:hidden"><div class="th" ${p.img?`style="background-image:url(${p.img});background-size:cover;background-position:center"`:''}>${p.img?'':ic('factory')}</div><div class="nb">${p.ph?'<span class="tag">نموذج تجريبي</span>':''}<h3>${p.t}</h3><p>${p.d}</p><div class="meta"><b>الموقع</b><span>${p.loc}</span><b>التنفيذ</b><span>${p.date}</span><b>الحالة</b><span>${p.st}</span></div></div></article>`).join('')}</div></div>`,
 contact:()=>`<div class="wrap pg"><h1>اتصل بنا</h1><p class="sub"></p><div class="grid">
  <div class="card"><div class="row"><div class="ico">${ic('phone')}</div><div><h3>شكاوى المواطنين</h3><a class="btn" href="tel:${D.complaints}">اتصل: ${D.complaints}</a></div></div></div>
  <div class="card"><div class="row"><div class="ico">${ic('clock')}</div><div><h3>الدوام الرسمي</h3><p>الأحد إلى الخميس<br>8:00 ص – 2:45 م</p></div></div></div>
  <div class="card"><div class="row"><div class="ico">${ic('zap')}</div><div><h3>فرق الطوارئ والصيانة</h3><p>متاحة 24 ساعة، 7 أيام في الأسبوع</p></div></div></div>
  <div class="card"><div class="row"><div class="ico">${ic('pin')}</div><div><h3>موقع الفرع</h3><p>الإحداثيات: 31.049444، 46.255087</p><a class="btn g" ${ext(D.map)}>فتح في خرائط Google</a></div></div></div>
  <div class="card"><h3>التواصل الاجتماعي</h3><div class="soc"><a class="btn" ${ext(D.fb)}>فيسبوك</a><a class="btn" ${ext(D.yt)}>يوتيوب</a></div></div></div></div>`
};
function detail(id){const n=NW().find(x=>x.id===id);if(!n)return V.news();return `<div class="wrap pg"><a class="crumb" href="#news">← العودة إلى الأخبار</a><article class="card">${n.ph?'<span class="tag">محتوى تجريبي</span>':''}<h1>${n.t}</h1>${n.date?`<span class="date">${n.date}</span>`:''}${n.img?`<img src="${n.img}" alt="ملاكات الورشة الفنية خلال تصليح المحولات الكهربائية" style="width:100%;border-radius:12px;margin:12px 0">`:''}${[].concat(n.body).map(p=>`<p>${p}</p>`).join('')}</article></div>`}

let ht;function heroSlide(){clearInterval(ht);const b=$('#hbg');if(!b)return;const s=[...b.querySelectorAll('i')],d=$('#hd');let i=0;d.innerHTML=s.map(()=>'<button></button>').join('');
 const m=()=>{s.forEach((x,k)=>x.classList.toggle('on',k===i));[...d.children].forEach((x,k)=>x.classList.toggle('on',k===i))};
 const g=k=>{i=(k+s.length)%s.length;m()};const rs=()=>{clearInterval(ht);ht=setInterval(()=>g(i+1),6000)};
 [...d.children].forEach((x,k)=>x.onclick=()=>{g(k);rs()});$('#hn').onclick=()=>{g(i+1);rs()};$('#hp').onclick=()=>{g(i-1);rs()};m();rs()}

function pickImg(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.src=URL.createObjectURL(f)};i.click()}

const TB=[['news','الأخبار'],['projects','المشاريع'],['stats','الأرقام'],['svc','الخدمات'],['home','الرئيسية والتواصل']];
const fld=(p,l,v,t)=>`<label class="fl">${l}${t==='area'?`<textarea data-p="${p}" rows="7">${esc(v)}</textarea>`:`<input data-p="${p}" ${t==='num'?'data-n="1" inputmode="numeric"':''} value="${esc(v)}">`}</label>`;
function list(k,fs,fixed){return D[k].map((it,i)=>`<div class="card ad"><div class="adh"><b>${esc(it.t||'عنصر جديد')}${it.pub===false?' (مسودة)':''}</b><span><button class="ib" data-a="up" data-k="${k}" data-i="${i}" aria-label="أعلى">↑</button> <button class="ib" data-a="dn" data-k="${k}" data-i="${i}" aria-label="أسفل">↓</button>${fixed?'':` <button class="ib" data-a="del" data-k="${k}" data-i="${i}" aria-label="حذف">🗑</button>`}</span></div>${fs.map(f=>f[2]==='img'?`<div class="fl">الصورة<div>${it.img?`<img src="${it.img}" alt="" style="height:70px;border-radius:8px;display:block;margin:4px 0">`:''}<button class="btn g" data-a="img" data-k="${k}" data-i="${i}">اختيار صورة</button></div></div>`:fld(`${k}.${i}.${f[0]}`,f[1],f[0]==='body'?[].concat(it.body||[]).join('\n\n'):it[f[0]],f[2])).join('')}${fixed?'':`<label class="fl"><input type="checkbox" data-c="${k}.${i}.pub" ${it.pub!==false?'checked':''} style="display:inline;width:auto"> منشور (إلغاء التأشير = مسودة)</label>`}</div>`).join('')+(fixed?'':`<button class="btn" data-a="add" data-k="${k}">+ إضافة</button>`)}
function draw(){const y=scrollY;let b='';
 if(tab==='news')b=list('news',[['t','العنوان'],['date','التاريخ'],['d','وصف مختصر'],['img','','img'],['body','نص الخبر (افصل الفقرات بسطر فارغ)','area']]);
 if(tab==='projects')b=list('projects',[['t','اسم المشروع'],['d','الوصف'],['loc','الموقع'],['date','تاريخ التنفيذ'],['st','الحالة'],['img','','img']]);
 if(tab==='stats')b=`<div class="card">${fld('stats.0.n','عدد المحطات الثانوية',D.stats[0].n)}${fld('stats.1.n','عدد المشتركين المسجلين',D.stats[1].n)}${fld('hours','ساعات التجهيز اليومي',D.hours,'num')}${D.digital.map((x,i)=>fld(`digital.${i}.v`,x.t+' (%)',x.v,'num')).join('')}</div>`;
 if(tab==='svc')b=list('services',[['t','العنوان'],['d','الوصف'],['u','الرابط']],1)+`<div class="card">${fld('tariff','رابط دليل تعرفة وأجور الكهرباء',D.tariff)}</div>`;
 if(tab==='home')b=`<div class="card">${fld('hero.h1','عنوان الهيرو',D.hero.h1)}${fld('hero.h2','العنوان الفرعي',D.hero.h2)}${fld('hero.p','الوصف',D.hero.p,'area')}${fld('complaints','رقم شكاوى المواطنين',D.complaints)}${fld('fb','رابط فيسبوك',D.fb)}${fld('yt','رابط يوتيوب',D.yt)}${fld('map','رابط الخريطة',D.map)}</div>`;
 $('#app').innerHTML=`<div class="wrap pg"><h1>لوحة التحكم</h1><p class="sub">التعديلات لا تظهر للزوار إلا بعد الضغط على «حفظ ونشر».</p><div class="tabs">${TB.map(([k,t])=>`<button class="btn ${k===tab?'':'g'}" data-a="tab" data-k="${k}">${t}</button>`).join('')}</div>${b}<div class="savebar"><button class="btn" data-a="save">حفظ ونشر</button><span id="msg"></span></div></div>`;scrollTo(0,y)}
(async()=>{try{const u=await claude.use('user');if(u&&u.canEdit()){const l=document.createElement('a');l.className='ib';l.href='#admin';l.textContent='⚙';l.setAttribute('aria-label','لوحة التحكم');document.querySelector('.tools').prepend(l)}}catch(e){}})();
const GH=/github\.io$/i.test(location.hostname);
function ghLogin(){return new Promise(res=>{const S=sessionStorage,v=k=>{try{return S.getItem(k)||''}catch(e){return ''}};
 $('#app').innerHTML=`<div class="wrap pg"><h1>لوحة التحكم</h1><div class="card"><p>سجّل الدخول بمفتاح GitHub الخاص بمستودع الموقع.</p><label class="fl">المستودع (اسم المستخدم/اسم المستودع)<input id="gr" dir="ltr" value="${esc(v('gr'))}" placeholder="username/repo"></label><label class="fl">مسار الملف<input id="gp" dir="ltr" value="${esc(v('gp')||'index.html')}"></label><label class="fl">مفتاح GitHub (Token)<input id="gt" type="password" dir="ltr" value="${esc(v('gt'))}"></label><button class="btn" id="gb">دخول</button> <span id="gm"></span></div></div>`;
 $('#gb').onclick=async()=>{const repo=$('#gr').value.trim(),path=$('#gp').value.trim()||'index.html',tok=$('#gt').value.trim(),m=$('#gm');m.textContent=' جارٍ التحقق…';
  const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};
  try{const r=await fetch('https://api.github.com/repos/'+repo,{headers:H});if(!r.ok)throw new Error(r.status===404||r.status===401?'المفتاح أو اسم المستودع غير صحيح':'خطأ '+r.status);
   const j=await r.json();if(!j.permissions||!j.permissions.push)throw new Error('المفتاح لا يملك صلاحية الكتابة على هذا المستودع');
   try{S.setItem('gr',repo);S.setItem('gp',path);S.setItem('gt',tok)}catch(e){}
   const api='https://api.github.com/repos/'+repo+'/contents/'+path;
   res({save:async html=>{const g=await fetch(api,{headers:{...H,Accept:'application/vnd.github.object+json'}});if(!g.ok)throw new Error('تعذر قراءة الملف ('+g.status+')');const sha=(await g.json()).sha;
    const by=new TextEncoder().encode(html);let bin='';for(let i=0;i<by.length;i+=32768)bin+=String.fromCharCode.apply(null,by.subarray(i,i+32768));
    const p=await fetch(api,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'تحديث المحتوى من لوحة التحكم',content:btoa(bin),sha})});if(!p.ok)throw new Error(p.status===409?'الملف تغيّر على GitHub، أعد تحميل الصفحة':'GitHub '+p.status)}})}
  catch(e){m.textContent=' '+e.message}}})}
async function renderAdmin(){const app=$('#app');app.innerHTML='<div class="wrap pg"><h1>لوحة التحكم</h1><p>جارٍ التحقق من الصلاحية… (v3)</p></div>';let u=null,a=null;if(!GH)try{u=await claude.use('user');a=await claude.use('artifact')}catch(e){}
 let ok=false;try{ok=!!(u&&a&&u.canEdit())}catch(e){}
 let gh=null;if(!ok&&(GH||!window.claude)){gh=await ghLogin();if(!gh)return}
 if(!ok&&!gh){let ce='-';try{ce=u?String(u.canEdit()):'-'}catch(e){ce='error'}
 app.innerHTML='<div class="wrap pg"><h1>لوحة التحكم</h1><div class="card"><p>هذه الصفحة للمحررين المخولين فقط. افتحها بحساب لديه صلاحية التعديل على الموقع.</p><p class="sub">تشخيص: user='+(u?'yes':'no')+' | artifact='+(a?'yes':'no')+' | canEdit='+ce+'</p></div></div>';return}
 draw();
 app.oninput=e=>{const t=e.target;if(t.dataset.p)setP(t.dataset.p,t.value,t.dataset.n)};
 app.onchange=e=>{const t=e.target;if(t.dataset.c)setP(t.dataset.c,t.checked)};
 app.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const{a:act,k,i}=b.dataset,n=+i;
  if(act==='tab'){tab=k;draw()}
  else if(act==='add'){D[k].unshift(k==='news'?{id:String(Date.now()),t:'',date:'',d:'',img:'',body:[],pub:false}:{t:'',d:'',loc:'',date:'',st:'',img:'',pub:false});draw()}
  else if(act==='up'&&n>0){[D[k][n-1],D[k][n]]=[D[k][n],D[k][n-1]];draw()}
  else if(act==='dn'&&n<D[k].length-1){[D[k][n+1],D[k][n]]=[D[k][n],D[k][n+1]];draw()}
  else if(act==='del'){if(b.dataset.s){D[k].splice(n,1);draw()}else{b.dataset.s=1;b.textContent='تأكيد؟'}}
  else if(act==='img')pickImg(d=>{D[k][n].img=d;draw()});
  else if(act==='save'){const m=$('#msg');b.disabled=true;m.textContent=' جارٍ النشر…';try{await(a?a.publish(buildHtml()):gh.save(buildHtml()));if(gh){m.textContent=' تم الحفظ ✓ يظهر التغيير للزوار خلال دقيقة تقريباً';b.disabled=false}}catch(er){b.disabled=false;m.textContent=gh?' تعذر الحفظ: '+er.message:er.code==='conflict'?' تم تحديث الموقع من جهة أخرى، سيُعاد التحميل.':er.code==='not_writer'||er.code==='not_granted'?' ليست لديك صلاحية النشر.':' تعذر النشر: '+(er.code||'')}}}}
addEventListener('hashchange',route);route();
</script></body></html>
